spring.application.name=research

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.ai.mcp.client.name=research-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.openai-docs.url=https://developers.openai.com
spring.ai.mcp.client.streamable-http.connections.openai-docs.endpoint=/mcp

research.web-search.base-url=https://generativelanguage.googleapis.com
research.web-search.model=${GEMINI_SEARCH_MODEL:gemini-3.6-flash}
